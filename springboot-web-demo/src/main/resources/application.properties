server.port=8082

# MySQL连接配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MUSICHUB_DB_URL:jdbc:mysql://localhost:3306/springweb_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MUSICHUB_DB_USERNAME:root}
spring.datasource.password=${MUSICHUB_DB_PASSWORD:123456}

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.demo.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ===================== 新增音频上传配置 =====================
# 单文件最大100MB
spring.servlet.multipart.max-file-size=100MB
# 单次请求总大小100MB
spring.servlet.multipart.max-request-size=100MB
# 静态资源映射：访问 /audio/xxx 读取桌面music文件夹
spring.web.resources.static-locations=classpath:/static/,file:../music/

# 每次启动时安全地补齐评论相关数据表
spring.sql.init.mode=always

# Local Python vector RAG service. It remains on this computer and is optional:
# when unavailable, Java uses the existing SQL/keyword retrieval fallback.
vector-rag.base-url=${VECTOR_RAG_BASE_URL:http://127.0.0.1:8090}

# ===================== 混合检索加权 RRF =====================
# RRF 常数越大，排名差距的影响越平缓。
retrieval.fusion.rrf-k=60.0

# 默认问题：优先数据库精确命中，同时保留语义和关键词召回。
retrieval.fusion.sql-weight=3.0
retrieval.fusion.vector-weight=1.5
retrieval.fusion.keyword-weight=1.0

# 事实问题（出处、类型、简介、歌库查询）：提高 SQL 权重，减少语义误召回。
retrieval.fusion.factual.sql-weight=4.0
retrieval.fusion.factual.vector-weight=1.0
retrieval.fusion.factual.keyword-weight=1.5

# 推荐问题（类似、相似、换一些）：提高向量和关键词权重，增强模糊语义召回。
retrieval.fusion.recommendation.sql-weight=1.5
retrieval.fusion.recommendation.vector-weight=3.0
retrieval.fusion.recommendation.keyword-weight=2.0

# ===================== 二阶段 Rerank =====================
# 第一阶段由加权 RRF 召回候选；第二阶段结合问题意图和歌曲元数据重新排序。
retrieval.rerank.enabled=true
retrieval.rerank.fusion-weight=0.55
retrieval.rerank.metadata-weight=0.35
retrieval.rerank.corroboration-weight=0.10

# ===================== 低置信度拒答 =====================
# 置信度 = 检索来源质量 + 元数据匹配 + 多路一致性；低于阈值的候选不会进入回答证据。
retrieval.confidence.enabled=true
retrieval.confidence.retrieval-weight=0.45
retrieval.confidence.metadata-weight=0.40
retrieval.confidence.corroboration-weight=0.15
retrieval.confidence.factual-threshold=0.42
retrieval.confidence.recommendation-threshold=0.30
retrieval.confidence.default-threshold=0.36

# Independent LLM cost evaluation dataset
llm-cost.evaluation.dataset-path=${LLM_COST_EVALUATION_DATASET_PATH:../evaluation/llm-cost-eval.jsonl}

# 管理后台检索评测使用的50题数据集。
evaluation.dataset-path=${EVALUATION_DATASET_PATH:../evaluation/rag-eval-50.jsonl}
