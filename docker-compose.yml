services:
  mysql:
    image: mysql:8.0
    container_name: musichub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-musichub123}
      MYSQL_DATABASE: springweb_demo
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rag-service:
    build:
      context: ./rag-service
      args:
        RAG_MODEL_NAME: ${RAG_MODEL_NAME:-intfloat/multilingual-e5-small}
    container_name: musichub-rag
    restart: unless-stopped
    environment:
      RAG_MODEL_NAME: ${RAG_MODEL_NAME:-intfloat/multilingual-e5-small}
      RAG_DATA_DIR: /app/data
      RAG_MYSQL_HOST: mysql
      RAG_MYSQL_PORT: 3306
      RAG_MYSQL_USERNAME: root
      RAG_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-musichub123}
      RAG_MYSQL_DATABASE: springweb_demo
      RAG_EMBEDDING_CACHE_TTL_SECONDS: ${RAG_EMBEDDING_CACHE_TTL_SECONDS:-600}
      RAG_EMBEDDING_CACHE_MAX_ENTRIES: ${RAG_EMBEDDING_CACHE_MAX_ENTRIES:-512}
      RAG_SEARCH_CACHE_TTL_SECONDS: ${RAG_SEARCH_CACHE_TTL_SECONDS:-120}
      RAG_SEARCH_CACHE_MAX_ENTRIES: ${RAG_SEARCH_CACHE_MAX_ENTRIES:-256}
      TZ: Asia/Shanghai
    ports:
      - "${RAG_PORT:-8090}:8090"
    volumes:
      - rag-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  agent-service:
    build:
      context: ./agent-service
    container_name: musichub-agent
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://maas.qianwenaiapi.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      AGENT_MYSQL_HOST: mysql
      AGENT_MYSQL_PORT: 3306
      AGENT_MYSQL_USERNAME: root
      AGENT_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-musichub123}
      AGENT_MYSQL_DATABASE: springweb_demo
      VECTOR_RAG_BASE_URL: http://rag-service:8090
      MUSICHUB_TOOL_BASE_URL: http://backend:8082
      AGENT_TOOL_KEY: ${AGENT_TOOL_KEY:-}
      AGENT_TOOL_MAX_ATTEMPTS: ${AGENT_TOOL_MAX_ATTEMPTS:-2}
      AGENT_TOOL_PARALLEL_MAX_WORKERS: ${AGENT_TOOL_PARALLEL_MAX_WORKERS:-4}
      AGENT_TOOL_RETRY_BACKOFF_SECONDS: ${AGENT_TOOL_RETRY_BACKOFF_SECONDS:-0.1}
      AGENT_TOOL_CIRCUIT_FAILURE_THRESHOLD: ${AGENT_TOOL_CIRCUIT_FAILURE_THRESHOLD:-3}
      AGENT_TOOL_CIRCUIT_RECOVERY_SECONDS: ${AGENT_TOOL_CIRCUIT_RECOVERY_SECONDS:-30}
      AGENT_AUDIT_RETENTION_DAYS: ${AGENT_AUDIT_RETENTION_DAYS:-30}
      TZ: Asia/Shanghai
    ports:
      - "${AGENT_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      rag-service:
        condition: service_healthy

  backend:
    build:
      context: ./springboot-web-demo
    container_name: musichub-backend
    restart: unless-stopped
    environment:
      MUSICHUB_DB_URL: jdbc:mysql://mysql:3306/springweb_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MUSICHUB_DB_USERNAME: root
      MUSICHUB_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-musichub123}
      MUSICHUB_JWT_SECRET: ${MUSICHUB_JWT_SECRET:-}
      VECTOR_RAG_BASE_URL: http://rag-service:8090
      VECTOR_RAG_SEARCH_CACHE_TTL_MS: ${VECTOR_RAG_SEARCH_CACHE_TTL_MS:-60000}
      PROMPT_CACHE_TTL_MS: ${PROMPT_CACHE_TTL_MS:-30000}
      PROMPT_EVALUATION_CACHE_TTL_MS: ${PROMPT_EVALUATION_CACHE_TTL_MS:-300000}
      AGENT_SERVICE_BASE_URL: http://agent-service:8100
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      AGENT_TOOL_KEY: ${AGENT_TOOL_KEY:-}
      EVALUATION_DATASET_PATH: /app/evaluation/rag-eval-50.jsonl
      LLM_COST_EVALUATION_DATASET_PATH: /app/evaluation/llm-cost-eval.jsonl
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      LLM_QUOTA_REQUESTS_PER_MINUTE: ${LLM_QUOTA_REQUESTS_PER_MINUTE:-20}
      LLM_QUOTA_CONCURRENT_STREAMS: ${LLM_QUOTA_CONCURRENT_STREAMS:-2}
      LLM_QUOTA_DAILY_TOKEN_LIMIT: ${LLM_QUOTA_DAILY_TOKEN_LIMIT:-100000}
      LLM_QUOTA_DAILY_COST_LIMIT: ${LLM_QUOTA_DAILY_COST_LIMIT:-10.0}
      REGRESSION_SCHEDULE_ENABLED: ${REGRESSION_SCHEDULE_ENABLED:-true}
      REGRESSION_SCHEDULE_CRON: "${REGRESSION_SCHEDULE_CRON:-0 0 3 * * *}"
      REGRESSION_TOP_K: ${REGRESSION_TOP_K:-5}
      REGRESSION_ACCURACY_DROP: ${REGRESSION_ACCURACY_DROP:-0.05}
      REGRESSION_RECALL_DROP: ${REGRESSION_RECALL_DROP:-0.05}
      REGRESSION_LATENCY_INCREASE_RATIO: ${REGRESSION_LATENCY_INCREASE_RATIO:-0.50}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    volumes:
      - ./music:/app/music
      - ./evaluation:/app/evaluation
    depends_on:
      mysql:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy

  frontend:
    build:
      context: ./vue-login
    container_name: musichub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  rag-data:
